<!-- Modal de Comprovante Digital do Ponto Eletrônico (Portaria 671 MTP) -->
<div id="pontoReceiptModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);z-index:9999;align-items:center;justify-content:center;padding:16px;">
  <div class="ponto-receipt-card" style="width:100%;max-width:440px;">
    <div class="ponto-receipt-header">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin-bottom:4px;">
        COMPROVANTE DE REGISTRO DE PONTO DO TRABALHADOR
      </div>
      <h4>{{ organization.name|default:"JUMBI - SISTEMA JURÍDICO" }}</h4>
      <div style="font-size:10px;color:#94a3b8;">Portaria MTP nº 671/2021 · Assinatura Digital SHA-256</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin:14px 0;">
      <div class="ponto-receipt-row">
        <span>Colaborador:</span>
        <strong id="receiptEmployeeName" style="color:#fff;">-</strong>
      </div>
      <div class="ponto-receipt-row">
        <span>Tipo de Registro:</span>
        <strong id="receiptType" style="color:var(--primary);">-</strong>
      </div>
      <div class="ponto-receipt-row">
        <span>Horário Oficial:</span>
        <strong id="receiptTimestamp" style="color:#fff;">-</strong>
      </div>
      <div class="ponto-receipt-row">
        <span>Método:</span>
        <span id="receiptSource" style="color:#10b981;">Reconhecimento Facial</span>
      </div>
    </div>

    <!-- Snapshot foto miniatura -->
    <div style="text-align:center;margin:12px 0;">
      <img id="receiptPhoto" src="" alt="Foto biométrica" style="display:none;width:110px;height:110px;object-fit:cover;border-radius:10px;margin:0 auto;border:2px solid var(--primary);box-shadow:0 0 14px rgba(245,160,0,0.3);">
    </div>

    <div style="margin-top:12px;">
      <div style="font-size:9px;text-transform:uppercase;color:#64748b;letter-spacing:0.5px;">Código de Autenticação Digital (SHA-256):</div>
      <div id="receiptHash" class="ponto-receipt-hash">...</div>
    </div>

    <div style="display:flex;gap:8px;margin-top:18px;">
      <button type="button" id="btnPrintReceipt" class="button button-secondary" style="flex:1;font-size:11px;">
        Imprimir
      </button>
      <button type="button" id="btnCloseReceipt" class="button button-primary" style="flex:1;font-size:11px;">
        Concluir
      </button>
    </div>
  </div>
</div>
