{% if page.has_other_pages %}<nav class="portal-pagination" aria-label="Paginação">{% if page.has_previous %}<a class="button button-secondary" href="?page={{ page.previous_page_number }}{% if state %}&state={{ state }}{% endif %}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button button-secondary" href="?page={{ page.next_page_number }}{% if state %}&state={{ state }}{% endif %}">Próxima</a>{% endif %}</nav>{% endif %}
