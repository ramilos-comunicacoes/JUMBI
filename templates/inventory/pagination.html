{% if page.has_other_pages %}<nav class="inventory-pagination" aria-label="Páginas de resultados">{% if page.has_previous %}<a class="button button-secondary" href="?{{ query_string }}&page={{ page.previous_page_number }}">Anterior</a>{% endif %}<span>{{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button button-secondary" href="?{{ query_string }}&page={{ page.next_page_number }}">Próxima</a>{% endif %}</nav>{% endif %}
